[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-os"
version = "0.1.0"
description = "Nexus — a local-first personal AI operating system (study, email, calendar, knowledge)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Haidar" }]
keywords = ["ai", "assistant", "local-first", "ollama", "agents"]

# Core runtime dependencies. Deliberately lean: no PyTorch / transformers / DSPy.
# Generation AND embeddings are delegated to Ollama (a separate local process),
# which keeps this package fully Python 3.12–3.14 wheel-friendly.
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.7",
    "apscheduler>=3.10",
    "keyring>=24.3",
]

[project.optional-dependencies]
# Google connectors (Gmail + Calendar). Installed on demand by the setup wizard.
google = [
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
# Local web dashboard.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]
# Native desktop window (uses the OS WebView2 component, not a browser).
desktop = [
    "pywebview>=5.0",
]
# Voice: local, free speech-to-text and text-to-speech (see specs/voice.md).
voice = [
    "SpeechRecognition>=3.10",  # free Google recognizer (STT, no key)
    "sounddevice>=0.4",         # microphone capture
    "pyttsx3>=2.90",            # offline TTS via Windows SAPI5 voices
    "faster-whisper>=1.0",      # optional local STT fallback
    "keyboard>=0.13",           # optional global hotkey
]
# Tools to build the standalone Nexus.exe.
build = [
    "pyinstaller>=6.0",
    "pillow>=10.0",
]
# Developer / test tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
nexus = "nexus.interface.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
